spring:
  datasource:
    url: jdbc:mysql://prod-db-server:3306/blog?useSSL=true&serverTimezone=UTC&characterEncoding=utf-8
    username: ${DB_USERNAME:blog_user}
    password: ${DB_PASSWORD:changeit}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST:prod-redis-server}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeit}
      database: 0
      timeout: 3000ms
      ssl:
        enabled: true
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 5

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:prod-rabbitmq-server}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:blog_user}
    password: ${RABBITMQ_PASSWORD:changeit}
    virtual-host: /blog
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 10
        max-concurrency: 20
        prefetch: 5

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: WARN
    com.example: INFO
    com.example.mapper: WARN
  file:
    name: logs/prod/demoBlog2-prod.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 90
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:prod-secret-key-for-jwt-token-generation-must-be-very-long-and-secure}
  expiration: 3600000

app:
  cors:
    allowed-origins: https://yourdomain.com
    allowed-methods: GET,POST,PUT,DELETE
    allowed-headers: Content-Type,Authorization
    allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true

server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192